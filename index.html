<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0a14">
<meta name="description" content="Surat kecil untuk menemani hari yang terasa berat, dengan kucing lucu.">
<title>Little Safe Place ♥</title>

<style>
:root {
  --bg: #1b0a14;
  --card: rgba(46, 17, 34, .92);
  --pink: #ff9fc6;
  --cream: #ffe9f2;
  --dim: #c98aa8;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(14px, env(safe-area-inset-top)) 14px
           max(14px, env(safe-area-inset-bottom));
  background: radial-gradient(120% 90% at 50% 0%,
    #3b1229 0%, var(--bg) 60%, #10060c 100%);
  color: var(--cream);
  font-family: "Segoe UI", system-ui, sans-serif;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

.card {
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: clamp(14px, 4vw, 26px);
  background: linear-gradient(180deg,
    rgba(58, 22, 38, .9), var(--card));
  border: 1px solid rgba(255, 159, 198, .18);
  border-radius: 24px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  text-align: center;
}

.top {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  min-height: 28px;
}

.tag {
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--dim);
}

.music {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255, 159, 198, .35);
  background: transparent;
  color: var(--pink);
  font-size: 18px;
  cursor: pointer;
}

.music.off {
  opacity: .45;
  text-decoration: line-through;
}

.stage {
  position: relative;
  width: min(76vw, 320px, 40vh);
  aspect-ratio: 1;
  margin: 2px 0;
}

.stage::before {
  content: "";
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 143, 190, .38), transparent 70%);
  filter: blur(16px);
}

.stage img {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 20px;
}

h1 {
  margin: 4px 0 0;
  font-size: clamp(1.15rem, 5vw, 1.6rem);
  line-height: 1.3;
}

.msg {
  margin: 0;
  min-height: 4.5em;
  max-width: 38ch;
  font-size: clamp(.95rem, 3.8vw, 1.05rem);
  line-height: 1.6;
  color: #ffe1ee;
  white-space: pre-line;
}

.actions {
  position: relative;
  width: 100%;
  min-height: 52px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.actions.asking {
  min-height: 130px;
  align-items: flex-start;
}

.btn {
  min-height: 48px;
  padding: 0 22px;
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-size: clamp(.9rem, 3.8vw, 1rem);
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .15s ease;
}

.btn:active { transform: scale(.96); }

.primary {
  background: linear-gradient(180deg, #ffb3d3, #ff7fb4);
  color: #2a0a19;
  box-shadow: 0 10px 24px rgba(255, 127, 180, .3);
}

.ghost {
  position: absolute;
  background: transparent;
  color: var(--pink);
  border: 1px solid rgba(255, 159, 198, .5);
}

.hint {
  margin: 0;
  min-height: 1.2em;
  font-size: clamp(.75rem, 2.8vw, .85rem);
  color: var(--dim);
}

.hidden { display: none !important; }

.heart {
  position: fixed;
  bottom: -10vh;
  pointer-events: none;
  animation: rise linear forwards;
  will-change: transform, opacity;
}

@keyframes rise {
  to {
    transform: translateY(-115vh) rotate(18deg);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .heart { animation-duration: 1s !important; }
  .btn { transition: none; }
}
</style>
</head>

<body>
<audio id="music" src="img/music.mp3" loop preload="auto"></audio>

<main class="card">
  <div class="top">
    <span class="tag" id="tag">a little note for you</span>
    <button class="music" id="musicBtn" type="button"
      aria-label="Nyalakan atau matikan musik">♪</button>
  </div>

  <div class="stage">
    <img id="gif" src="img/funny.gif"
      alt="Kucing lucu untuk menemani harimu">
  </div>

  <h1 id="head">Hi, Vie ♥</h1>

  <p class="msg" id="msg">
    Ada sesuatu kecil yang pengen aku kasih ke kamu.
    Buka pelan-pelan yaa.
  </p>

  <div class="actions" id="actions">
    <button class="btn primary" id="startBtn" type="button">
      Buka surat kecil ♥
    </button>

    <button class="btn primary hidden" id="nextBtn" type="button">
      Lanjut duluu →
    </button>

    <button class="btn primary hidden" id="yesBtn" type="button">
      Temenin aku bentar ♥
    </button>

    <button class="btn ghost hidden" id="noBtn" type="button">
      Belum mau senyum
    </button>

    <button class="btn primary hidden" id="hugBtn" type="button">
      Kirim hati ♥
    </button>
  </div>

  <p class="hint" id="hint">
    psst... ada kucing yang mau menyampaikan sesuatu
  </p>
</main>

<div id="hearts" aria-hidden="true"></div>

<script>
const SCENES = [
  {
    head: "Hi, Viee ♥",
    msg: "Welcome to your tiny little corner.\nTempat buat istirahat sebentar dari ramainya dunia.",
    gif: "funny"
  },
  {
    head: "Can we slow down a little?",
    msg: "Aku tau akhir-akhir ini mungkin rasanya berat banget.\nDan kamu sendiri pun belum ngerti kenapa.\n\nIt's okay, be. Kamu ga harus ngerti semuanya hari ini.",
    gif: "tongue"
  },
  {
    head: "A reminder for you ♡",
    msg: "Takut sama hari esok bukan berarti sesuatu yang buruk pasti terjadi.\n\nKadang kita memang belum punya semua jawabannya. And that's okay.\nKamu boleh jalan pelan-pelan.",
    gif: "funny"
  },
  {
    head: "Btw, look at this creature.",
    msg: "Dia ga punya tugas, ga punya deadline, ga mikirin hari Senin.\n\nKerjaan dia cuma makan, tidur, terus menghakimi manusia.\nHonestly, living the dream. 😭",
    gif: "tongue"
  },
  {
    head: "One little thing, be ♡",
    msg: "Kamu ga harus selalu kuat.\nGa harus selalu kelihatan baik-baik aja.\nGa harus punya alasan yang jelas buat merasa capek.\n\nKalau hari ini berat, kamu boleh istirahat dan minta ditemenin.",
    gif: "kiss"
  },
  {
    head: "Can I remind you of something?",
    msg: "You don't have to figure out your whole life tonight.\n\nCukup lewatin satu waktu, satu langkah, satu hari dulu.\nBesok ga perlu kamu hadapi semuanya sekarang.\n\nDan kalau kamu butuh bantuan, kamu boleh minta ditemenin. ♥",
    gif: "kiss"
  },
  {
    head: "Last thing, promise. ♡",
    msg: "Aku ga punya tombol ajaib buat ngilangin semua rasa takutmu.\n\nTapi aku berharap surat kecil ini bisa bikin malam kamu terasa sedikit lebih ringan.\n\nOh iya, kucingnya nitip salam. Katanya jangan lupa makan. 😭",
    gif: "funny",
    ask: true
  }
];

const TEASES = [
  "Kucing ini kabur dari tanggung jawab, tapi balik lagi demi kamu. 😭",
  "Dia berusaha menghiburmu. Skill komunikasi: meong.",
  "Kalau senyum belum bisa, minimal kasihan dulu sama kucingnya. 😭",
  "Breaking news: seekor kucing ditugaskan memperbaiki mood manusia."
];

const NO_TEXTS = [
  "Belum mau senyum",
  "Masih capek ya?",
  "Gapapa kok ♡",
  "Aku tunggu di sini",
  "Kucingnya masih berusaha 😭"
];

const $ = id => document.getElementById(id);

const gifEl = $("gif");
const headEl = $("head");
const msgEl = $("msg");
const hintEl = $("hint");
const tagEl = $("tag");
const actions = $("actions");
const music = $("music");
const musicBtn = $("musicBtn");

const btn = {
  start: $("startBtn"),
  next: $("nextBtn"),
  yes: $("yesBtn"),
  no: $("noBtn"),
  hug: $("hugBtn")
};

let step = -1;
let typingTimer = null;
let dodges = 0;

function show(el) {
  el.classList.remove("hidden");
}

function hide(el) {
  el.classList.add("hidden");
}

function type(text) {
  clearInterval(typingTimer);
  msgEl.textContent = "";

  let i = 0;

  typingTimer = setInterval(() => {
    msgEl.textContent = text.slice(0, ++i);

    if (i >= text.length) {
      clearInterval(typingTimer);
      typingTimer = null;
    }
  }, 25);
}

function setGif(kind) {
  gifEl.src = "img/" + kind + ".gif";
}

function render() {
  const scene = SCENES[step];

  headEl.textContent = scene.head;
  type(scene.msg);
  setGif(scene.gif);

  tagEl.textContent = "little note " + (step + 1) +
    " / " + SCENES.length;

  hide(btn.next);
  hide(btn.yes);
  hide(btn.no);
  hide(btn.hug);
  hide(btn.start);

  actions.classList.remove("asking");
  hintEl.textContent = "take your time, no rush ♡";

  if (scene.ask) {
    setupAsk();
  } else {
    show(btn.next);
  }
}

function start() {
  playMusic();
  step = 0;
  render();
}

function nextScene() {
  if (step >= SCENES.length - 1) return;

  step += 1;
  render();
}

function setupAsk() {
  show(btn.yes);
  show(btn.no);

  actions.classList.add("asking");
  dodges = 0;
  btn.no.textContent = NO_TEXTS[0];

  hintEl.textContent = "pilih sesukamu, ga ada kewajiban senyum kok ♡";

  requestAnimationFrame(() => {
    btn.no.style.left =
      "calc(50% - " + (btn.no.offsetWidth / 2) + "px)";
    btn.no.style.top = "76px";
  });
}

function dodge(event) {
  if (event) event.preventDefault();

  dodges += 1;

  btn.no.textContent =
    NO_TEXTS[Math.min(dodges, NO_TEXTS.length - 1)];

  const bw = btn.no.offsetWidth || 110;
  const bh = btn.no.offsetHeight || 48;

  const size = 6;
  const maxX = Math.max(size, actions.clientWidth - bw - size);
  const minY = 58;
  const maxY = Math.max(minY, actions.clientHeight - bh - size);

  btn.no.style.left =
    size + Math.random() * (maxX - size) + "px";

  btn.no.style.top =
    minY + Math.random() * (maxY - minY) + "px";

  if (dodges % 3 === 0) {
    headEl.textContent = "Kucingnya panik 😭";

    type(TEASES[Math.floor(Math.random() * TEASES.length)]);
    setGif("funny");
  }
}

function comfort() {
  actions.classList.remove("asking");

  hide(btn.yes);
  hide(btn.no);

  show(btn.hug);

  headEl.textContent = "Here, a little heart. ♥";

  type("Makasih udah mampir ke sudut kecil ini.\n\nKamu ga perlu langsung merasa lebih baik, be. Istirahat dulu kalau perlu. Perasaanmu layak didengerin, dan kamu juga layak dapet bantuan saat semuanya terasa berat.");

  setGif("kiss");

  tagEl.textContent = "sending you warmth ♡";

  hintEl.textContent = "tekan tombolnya kalau mau kirim hati";

  rainingHearts();
}

function hug() {
  headEl.textContent = "A little heart for you ♥";

  type("Semoga malam ini terasa sedikit lebih ringan.\n\nKalau rasa takut itu datang lagi, kamu ga harus memendamnya sendirian. Cerita ke orang yang kamu percaya, ya. Kamu boleh minta ditemenin.");

  hintEl.textContent = "one moment at a time ♡";

  burst(18);
}

function playMusic() {
  music.volume = .4;

  music.play().then(() => {
    musicBtn.classList.remove("off");
  }).catch(() => {
    hintEl.textContent = "tap ♪ kalau mau coba nyalain musik";
  });
}

musicBtn.addEventListener("click", () => {
  if (music.paused) {
    playMusic();
  } else {
    music.pause();
    musicBtn.classList.add("off");
  }
});

function spawnHeart() {
  const el = document.createElement("span");

  el.className = "heart";
  el.textContent = Math.random() < .75 ? "♥" : "✿";
  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = 14 + Math.random() * 20 + "px";

  el.style.color = [
    "#ff9fc6",
    "#ff5d8f",
    "#ffd1e3"
  ][Math.floor(Math.random() * 3)];

  el.style.animationDuration = 4 + Math.random() * 4 + "s";

  el.addEventListener("animationend", () => el.remove());

  $("hearts").appendChild(el);
}

function burst(n) {
  for (let i = 0; i < n; i++) {
    setTimeout(spawnHeart, i * 60);
  }
}

function rainingHearts() {
  let left = 35;

  const timer = setInterval(() => {
    spawnHeart();

    if (--left <= 0) {
      clearInterval(timer);
    }
  }, 300);
}

btn.start.addEventListener("click", start);
btn.next.addEventListener("click", nextScene);
btn.yes.addEventListener("click", comfort);
btn.hug.addEventListener("click", hug);

btn.no.addEventListener("pointerenter", dodge);
btn.no.addEventListener("pointerdown", dodge);

["funny", "kiss", "tongue"].forEach(kind => {
  const img = new Image();
  img.src = "img/" + kind + ".gif";
});
</script>
</body>
</html>
